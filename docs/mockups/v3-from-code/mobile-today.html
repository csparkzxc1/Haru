<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오늘 (모바일) · 하루</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="_shell.css" />
  <link rel="stylesheet" href="_phone.css" />
  <script>
    tailwind.config = {
      theme: { extend: { colors: { haru: { ink: "#1C1C1E", paper: "#FAFAF7", accent: "#FF6B35", muted: "#8E8E93" } } } },
    };
  </script>
</head>
<body class="min-h-screen flex items-start justify-center gap-8 py-12 bg-neutral-100">

  <!-- 1) 오늘 — 동기화 인디케이터 ⏳ 포함 -->
  <div class="phone-frame">
    <div class="phone-island"></div>
    <div class="phone-status">
      <span>9:41</span>
      <span class="signal">●●●● 5G ▮</span>
    </div>

    <div class="phone-content">
      <div class="flex-1 overflow-auto px-6 pt-6">
        <h1 class="text-3xl font-semibold tracking-tight text-haru-ink">오늘</h1>
        <p class="mt-1 text-sm text-haru-muted">5월 2일 금요일 · 어린이날</p>

        <!-- QuickEntry — components/QuickEntry.tsx -->
        <div class="mt-6 mb-6">
          <div class="flex items-center gap-2">
            <input value="" placeholder='예: "내일 오후 3시 팀 회의 #회의"' class="flex-1 px-4 py-3 rounded-xl border border-black/10 text-[15px] text-haru-ink" />
          </div>
        </div>

        <!-- 첫 번째: dirty (네트워크 끊긴 상태에서 추가됨, 아직 push 못함) -->
        <div class="flex items-start gap-3 py-3 border-b border-black/5">
          <div class="mt-0.5 h-5 w-5 rounded-full border border-haru-muted items-center justify-center flex"></div>
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-[15px] flex-1 text-haru-ink">팀 회의</span>
              <span class="text-[10px] text-haru-muted">⏳</span>
            </div>
            <div class="flex flex-wrap gap-2 mt-1">
              <span class="text-xs text-haru-muted">📅 5월 3일</span>
              <span class="text-xs text-haru-muted">#회의</span>
            </div>
          </div>
        </div>

        <div class="flex items-start gap-3 py-3 border-b border-black/5">
          <div class="mt-0.5 h-5 w-5 rounded-full border border-haru-muted"></div>
          <div class="flex-1">
            <span class="text-[15px] text-haru-ink">주간보고 초안 작성</span>
            <div class="flex flex-wrap gap-2 mt-1">
              <span class="text-xs text-haru-muted">📅 5월 2일</span>
              <span class="text-xs text-haru-muted">#보고</span>
            </div>
          </div>
        </div>

        <div class="flex items-start gap-3 py-3 border-b border-black/5">
          <div class="mt-0.5 h-5 w-5 rounded-full border border-haru-muted"></div>
          <div class="flex-1">
            <span class="text-[15px] text-haru-ink">치과 예약 확정 전화</span>
            <div class="flex flex-wrap gap-2 mt-1">
              <span class="text-xs text-haru-muted">#전화</span>
              <span class="text-xs text-haru-muted">#15분컷</span>
            </div>
          </div>
        </div>

        <div class="flex items-start gap-3 py-3 border-b border-black/5">
          <div class="mt-0.5 h-5 w-5 rounded-full bg-haru-accent border border-haru-accent items-center justify-center flex">
            <span class="text-white text-[10px]">✓</span>
          </div>
          <div class="flex-1">
            <span class="text-[15px] line-through text-haru-muted">자녀 어린이날 선물 사기</span>
            <div class="flex flex-wrap gap-2 mt-1">
              <span class="text-xs text-haru-muted">#가족</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab bar — app/_layout.tsx Tabs -->
      <div class="phone-tabbar">
        <div class="tab active"><span class="ico">☀︎</span><span>오늘</span></div>
        <div class="tab"><span class="ico">▦</span><span>이번주</span></div>
        <div class="tab"><span class="ico">▷</span><span>예정</span></div>
        <div class="tab"><span class="ico">∞</span><span>언제든지</span></div>
        <div class="tab"><span class="ico">✧</span><span>언젠가</span></div>
        <div class="tab"><span class="ico">⚙</span><span>설정</span></div>
      </div>
    </div>
  </div>

  <!-- 2) 설정 — 시니어 모드 / 색 모드 / 로그아웃 -->
  <div class="phone-frame">
    <div class="phone-island"></div>
    <div class="phone-status">
      <span>9:41</span>
      <span class="signal">●●●● 5G ▮</span>
    </div>

    <div class="phone-content">
      <div class="flex-1 overflow-auto px-6 pt-6">
        <h1 class="text-3xl font-semibold tracking-tight text-haru-ink">설정</h1>
        <p class="mt-1 text-sm text-haru-muted">데모 사용자</p>

        <div class="rounded-xl border border-black/5 p-4 mt-6 mb-4">
          <div class="text-xs uppercase tracking-widest text-haru-muted mb-2">색 모드</div>
          <div class="flex gap-2">
            <div class="px-3 py-2 rounded-md border border-black/10"><span class="text-sm text-haru-ink">시스템</span></div>
            <div class="px-3 py-2 rounded-md border border-haru-accent"><span class="text-sm text-haru-accent">라이트</span></div>
            <div class="px-3 py-2 rounded-md border border-black/10"><span class="text-sm text-haru-ink">다크</span></div>
          </div>

          <div class="text-xs uppercase tracking-widest text-haru-muted mt-5 mb-2">글자 크기</div>
          <div class="flex gap-2">
            <div class="px-3 py-2 rounded-md border border-haru-accent"><span class="text-sm text-haru-accent">기본</span></div>
            <div class="px-3 py-2 rounded-md border border-black/10"><span class="text-sm text-haru-ink">큰 글자</span></div>
          </div>
        </div>

        <div class="px-4 py-3 rounded-xl border border-black/10 mt-6">
          <span class="text-haru-accent text-center block">로그아웃</span>
        </div>
      </div>

      <div class="phone-tabbar">
        <div class="tab"><span class="ico">☀︎</span><span>오늘</span></div>
        <div class="tab"><span class="ico">▦</span><span>이번주</span></div>
        <div class="tab"><span class="ico">▷</span><span>예정</span></div>
        <div class="tab"><span class="ico">∞</span><span>언제든지</span></div>
        <div class="tab"><span class="ico">✧</span><span>언젠가</span></div>
        <div class="tab active"><span class="ico">⚙</span><span>설정</span></div>
      </div>
    </div>
  </div>

  <a href="index.html" class="fixed bottom-6 right-6 text-xs px-4 py-2 rounded-full bg-haru-ink text-haru-paper">← 목업 허브</a>
</body>
</html>
