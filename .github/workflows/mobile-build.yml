name: 모바일 EAS 빌드

# 수동 트리거. 프로파일 + 플랫폼 선택 가능.
# 빌드는 EAS 클라우드(https://expo.dev/accounts/haru/builds)에서 처리되므로
# Runner 는 큐 등록만 하고 종료. 빌드 결과는 expo.dev 에서 확인 +
# TestFlight/Play Console 에 자동 업로드.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS 프로파일"
        required: true
        type: choice
        default: "preview"
        options: [development, preview, production]
      platform:
        description: "플랫폼"
        required: true
        type: choice
        default: "all"
        options: [all, ios, android]
      submit:
        description: "빌드 후 자동 제출 (production 전용)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: EAS Build (큐 등록)
        working-directory: packages/mobile
        run: |
          eas build \
            --profile ${{ github.event.inputs.profile }} \
            --platform ${{ github.event.inputs.platform }} \
            --non-interactive \
            --no-wait

      - name: EAS Submit
        if: ${{ github.event.inputs.profile == 'production' && github.event.inputs.submit == 'true' }}
        working-directory: packages/mobile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 최신 production 빌드를 자동 선택.
          # Google Play 는 service account JSON 이 secret 으로 등록되어 있어야 함.
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}" > google-play-service-account.json
          eas submit \
            --profile production \
            --platform ${{ github.event.inputs.platform }} \
            --latest \
            --non-interactive
          rm -f google-play-service-account.json
